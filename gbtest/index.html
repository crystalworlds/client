<!DOCTYPE html>
<!--
  gbtest/index.html -- the Game Boy test page (13 Nov 2026).

  For the public Game Boy Emulator Shootout (github.com/gbdev/GBEmulatorShootout), whose
  harness drives this page with a browser: it picks a model, gives the page a test cartridge
  and reads the picture off the canvas. Nothing else is on the page: no welcome screen, no
  vault, no saves, no library, no sound, no television mode, no service worker.

  Stable ids for the harness:
    #model-dmg  #model-cgb  #model-sgb   model buttons (aria-pressed="true" on the chosen one)
    #file                                the cartridge (a file input)
    #screen                              the picture, a 160 x 144 canvas, one canvas pixel per Game Boy pixel
    #status                              data-state: loading | ready | running | error
  Also window.gbtest: { state, model, frames, startup, coreModel, build }.
  ?model=DMG|CGB|SGB picks the model in the address.

  The emulator is the site's own Game Boy core, the one the play window runs (gbtest.mjs).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="../FavIcon/favicon.ico">
<title>Game Boy Test Page</title>
<style>
  :root { --bg:#f4f5f7; --panel:#ffffff; --ink:#16181c; --dim:#5b6270; --line:#d5d9e0; --accent:#2f6fd6; --on:#ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0e1013; --panel:#171a1f; --ink:#e6e8ec; --dim:#9aa1ad; --line:#2a2e36; --accent:#6ea1ff; --on:#0e1013; } }
  :root[data-theme="dark"] { --bg:#0e1013; --panel:#171a1f; --ink:#e6e8ec; --dim:#9aa1ad; --line:#2a2e36; --accent:#6ea1ff; --on:#0e1013; }
  html, body { margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; padding:16px; }
  main { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:20px; margin:0; }
  p { margin:0; color:var(--dim); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button { font:inherit; padding:6px 14px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--on); }
  input[type=file] { font:inherit; color:var(--dim); max-width:100%; }
  .screen { background:#000; padding:8px; border-radius:6px; align-self:flex-start; max-width:100%; box-sizing:border-box; }
  canvas#screen { display:block; width:480px; height:432px; max-width:100%; image-rendering:pixelated; }
  @media (max-width: 520px) { canvas#screen { width:320px; height:288px; } }
  #status { font-size:14px; color:var(--dim); min-height:1.5em; }
  #status[data-state="error"] { color:#d33; }
  #status[data-state="running"] { color:var(--ink); }
</style>
</head>
<body data-state="loading">
<main>
  <h1>Game Boy test page</h1>
  <p>Runs one test cartridge on our Game Boy emulator, the same one the site plays games on, with the plain grey picture test suites compare against. Choose a model, then a cartridge file. The file stays in your browser.</p>
  <div class="row" role="group" aria-label="Model">
    <button type="button" id="model-dmg" data-model="DMG" aria-pressed="true">Game Boy</button>
    <button type="button" id="model-cgb" data-model="CGB" aria-pressed="false">Game Boy Color</button>
    <button type="button" id="model-sgb" data-model="SGB" aria-pressed="false">Super Game Boy</button>
  </div>
  <div class="row"><input type="file" id="file" accept=".gb,.gbc,.sgb,.bin"></div>
  <div class="screen"><canvas id="screen" width="160" height="144"></canvas></div>
  <div id="status" data-state="loading" role="status">Loading the emulator...</div>
</main>
<script type="module">
import { loadHost, startMachine, FRAME_HZ, SCREEN_W, SCREEN_H } from './gbtest.mjs?v=2.3.0';
import { Pacer } from '../play/gameboy/web/core.js';

const $ = id => document.getElementById(id);
const status = $('status'), canvas = $('screen');
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;
const img = ctx.createImageData(SCREEN_W, SCREEN_H);
const px = new Uint32Array(img.data.buffer);
const MODEL_NAMES = { DMG: 'Game Boy', CGB: 'Game Boy Color', SGB: 'Super Game Boy' };
const STARTUP = { none: 'no start-up program', own: 'our own start-up program' };
const T = window.gbtest = { state: 'loading', model: 'DMG', frames: 0, startup: '', coreModel: '', build: '', file: '' };

let host = null, mc = null, bytes = null, fileName = '', raf = 0;
const pacer = new Pacer(FRAME_HZ, 8);

function say(state, text) {
  T.state = state;
  status.dataset.state = state; document.body.dataset.state = state;
  status.textContent = text;
}
function clear() { px.fill(0xFF000000); ctx.putImageData(img, 0, 0); }

function pick(model) {
  if (!MODEL_NAMES[model]) return;
  T.model = model;
  for (const b of document.querySelectorAll('[data-model]')) b.setAttribute('aria-pressed', String(b.dataset.model === model));
  if (bytes) start();
}

function start() {
  if (!host || !bytes) return;
  cancelAnimationFrame(raf);
  if (mc) { try { mc.free(); } catch (_) {} mc = null; }
  T.frames = 0; clear();
  try {
    mc = startMachine(host, bytes, T.model);
  } catch (e) {
    say('error', String(e && e.message || e));
    return;
  }
  T.startup = mc.info.startup; T.coreModel = mc.info.coreModel; T.file = fileName;
  mc.draw(px); ctx.putImageData(img, 0, 0);
  pacer.reset(performance.now());
  say('running', 'Running ' + fileName + ' on the ' + MODEL_NAMES[T.model] + ' (' + STARTUP[mc.info.startup] + ').');
  raf = requestAnimationFrame(tick);
}

function tick(now) {
  if (!mc) return;
  const n = pacer.step(now);
  for (let i = 0; i < n; i++) mc.runFrame();
  if (n) { T.frames += n; mc.draw(px); ctx.putImageData(img, 0, 0); }
  raf = requestAnimationFrame(tick);
}

for (const b of document.querySelectorAll('[data-model]')) b.addEventListener('click', () => pick(b.dataset.model));
$('file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  say('loading', 'Reading ' + f.name + '...');
  try { bytes = new Uint8Array(await f.arrayBuffer()); fileName = f.name; }
  catch (err) { bytes = null; say('error', 'The file could not be read.'); return; }
  if (!host) { say('loading', 'Waiting for the emulator...'); return; }
  start();
});

clear();
const q = new URLSearchParams(location.search).get('model');
if (q) pick(q.toUpperCase());
try {
  const r = await fetch('../play/gameboy/build/gb.wasm?v=2.3.0', { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  host = await loadHost(await r.arrayBuffer());
  try { const s = await fetch('../play/gameboy/CORE-VERSION.json?v=2.3.0', { cache: 'no-store' }); if (s.ok) T.build = (await s.json()).sha256 || ''; } catch (_) {}
  if (bytes) start(); else say('ready', 'Ready. Choose a model, then a cartridge file.');
} catch (e) {
  say('error', 'The emulator did not load (' + (e && e.message || e) + ').');
}
</script>
</body>
</html>
